name: Deploy Team Neuchatel App

on:
  push:
    branches: [main]
    paths:
      - 'team-neuchatel/**'
      - '.github/workflows/team-neuchatel-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: team-neuchatel-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: team-neuchatel
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
