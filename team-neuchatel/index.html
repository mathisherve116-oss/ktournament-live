<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04121c"><title>Team Neuchâtel 6c6</title><style>
:root{--bg:#04121c;--p:#0a2233;--q:#102e43;--l:#284b61;--t:#f7fbff;--m:#9eb5c5;--a:#1779b3;--g:#45d49b;--w:#f2bb61;--r:#ef7378}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;padding:12px 10px 90px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.mut{color:var(--m);font-size:11px}.ok{color:var(--g);font-weight:900}.bad{color:var(--r)}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:10px;margin:9px 0}.input,.btn{width:100%;min-height:50px;border-radius:13px;border:1px solid var(--l);background:var(--q);color:#fff;padding:10px;font:inherit}.input{margin-top:8px}.btn{font-weight:900}.pri{background:var(--a);border:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.score{font-size:42px;font-weight:950;text-align:center}.clock{font-size:32px;font-weight:950;text-align:center}.title{font-weight:900}.pitch{height:500px;position:relative;border:2px solid #acd9ca;border-radius:22px;background:linear-gradient(#0d563a,#073d2a)}.slot{position:absolute;transform:translate(-50%,-50%);width:90px;background:transparent;border:0;color:white;text-align:center}.face{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:#23495e;display:grid;place-items:center;margin:auto;font-weight:900}.slot b{display:block;font-size:11px}.slot small{font-size:8px}.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;background:var(--q);border-radius:12px;padding:7px;margin-top:6px}.av{width:44px;height:44px;border-radius:50%;background:#23495e;display:grid;place-items:center;font-weight:900}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:#061622f8;border-top:1px solid var(--l);padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:20}.nav button{min-height:52px;border:0;border-radius:10px;background:transparent;color:var(--m);font-size:8px;font-weight:900}.nav button.on{background:var(--q);color:#fff}.event{background:var(--q);border-radius:10px;padding:8px;margin-top:6px;font-size:11px}.hidden{display:none}.diag{position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#5b1d1d;color:white;padding:8px;border-radius:10px;font-size:11px;display:none}
</style></head><body><div id="diag" class="diag"></div><div class="app"><div class="head"><div><h1 style="margin:0;font-size:20px">TEAM NEUCHÂTEL · 6c6</h1><div class="mut">V6.3 REAL MATCH SYNC · AUTONOME</div></div><div id="cloud" class="mut">DÉMARRAGE…</div></div><div id="root"><div class="card"><b>Chargement de l’application…</b><div class="mut">Si cet écran reste affiché, un diagnostic apparaîtra en haut.</div></div></div></div><script>
const URL='https://buohssisxszsrvrdblpq.supabase.co',KEY='sb_publishable_AgGaPSCbRvD3-01ziYWO9g_CYoCatlH',TEAM='48bc34db-4e0c-4838-9894-a5b16d73f25c',MATCH='0c67c627-abbc-4faa-b4d3-68d2d4ddf4b4';
const P=['GK','CB','LM','CM','RM','ST'],XY={GK:['89%','50%'],CB:['71%','50%'],LM:['52%','22%'],CM:['57%','50%'],RM:['52%','78%'],ST:['22%','50%']};
let token=localStorage.tn6_token||'',user=null,match=null,players=[],events=[],lineup={},role='observer',tab='match',poll=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=n=>String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),fmt=ms=>{let s=Math.max(0,Math.floor((+ms||0)/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function diag(e){let d=$('diag');d.style.display='block';d.textContent='ERREUR: '+(e?.message||e);$('cloud').textContent='ERREUR';$('cloud').className='bad'}
async function api(path,opt={}){let h={'apikey':KEY,'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;let r=await fetch(URL+path,{...opt,headers:h});let txt=await r.text();let data;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw new Error((data&&data.message)||(data&&data.error_description)||txt||('HTTP '+r.status));return data}
function elapsed(){if(!match)return 0;let n=+match.accumulated_ms||0;if(match.clock_status==='running'&&match.started_at)n+=Date.now()-Date.parse(match.started_at);return n}
async function login(email,password){let d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});token=d.access_token;localStorage.tn6_token=token;user=d.user;await boot()}
async function signup(email,password){let d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(d.access_token){token=d.access_token;localStorage.tn6_token=token;user=d.user;await boot()}else alert('Compte créé. Confirme ton e-mail puis connecte-toi.')}
async function currentUser(){if(!token)return null;try{return await api('/auth/v1/user')}catch{localStorage.removeItem('tn6_token');token='';return null}}
async function load(){let [m,p,e,r,s]=await Promise.all([api('/rest/v1/matches?id=eq.'+MATCH+'&select=*'),api('/rest/v1/players?team_id=eq.'+TEAM+'&select=*&order=display_name.asc'),api('/rest/v1/match_events?match_id=eq.'+MATCH+'&select=*&order=server_time.desc&limit=30'),api('/rest/v1/staff_memberships?team_id=eq.'+TEAM+'&select=role'),api('/rest/v1/match_snapshots?match_id=eq.'+MATCH+'&select=*')]);match=m[0];players=p||[];events=e||[];role=r[0]?.role||'observer';let base={};P.forEach((x,i)=>base[x]=players[i]?.id);lineup=s[0]?.snapshot?.lineup||base}
async function boot(){user=await currentUser();if(!user)return authScreen();await load();$('cloud').textContent='● CLOUD OK';$('cloud').className='ok';render();clearInterval(poll);poll=setInterval(async()=>{try{await load();render(tab,true)}catch(e){$('cloud').textContent='● HORS LIGNE';$('cloud').className='bad'}},2500)}
function authScreen(){ $('cloud').textContent='● CLOUD PRÊT';$('cloud').className='ok';$('root').innerHTML='<div class="card"><h2>Connexion Coach</h2><input id="em" class="input" type="email" placeholder="Email"><input id="pw" class="input" type="password" placeholder="Mot de passe (8 caractères minimum)"><div class="g2" style="margin-top:8px"><button id="li" class="btn pri">SE CONNECTER</button><button id="su" class="btn">CRÉER MON COMPTE</button></div><div class="mut" style="margin-top:8px">Premier coach : mathisherve116@gmail.com</div></div>'; $('li').onclick=()=>login($('em').value.trim(),$('pw').value).catch(diag);$('su').onclick=()=>signup($('em').value.trim(),$('pw').value).catch(diag)}
function name(id){return players.find(x=>x.id===id)?.display_name||'—'}
function nav(){return '<nav class="nav">'+[['match','MATCH'],['terrain','TERRAIN'],['tableau','TABLEAU'],['rot','ROT.'],['joueurs','JOUEURS'],['staff','STAFF']].map(x=>'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</nav>'}
function bench(){let f=new Set(Object.values(lineup));return players.filter(x=>x.status==='available'&&!f.has(x.id))}
function nextRot(){let f=P.map(x=>lineup[x]).filter(Boolean),b=bench();if(!f.length||!b.length)return null;let i=Math.floor(elapsed()/360000)%f.length;return{out:f[i],inn:b[0].id,pos:P.find(x=>lineup[x]===f[i])}}
function render(t=tab,soft=false){tab=t;let h='';if(t==='match'){let n=nextRot();h='<div class="card"><div class="score">'+match.score_us+' – '+match.score_them+'</div><div class="mut" style="text-align:center">PÉRIODE '+match.period+'</div><div id="clk" class="clock">'+fmt(elapsed())+'</div><div class="g2"><button id="start" class="btn pri">'+(match.clock_status==='running'?'❚❚ PAUSE':'▶ DÉMARRER')+'</button><button id="per" class="btn">PÉRIODE +</button></div></div><div class="card"><b>Prochaine rotation</b><div class="event" style="font-size:16px;text-align:center">'+(n?esc(name(n.out))+' ↓ → '+esc(name(n.inn))+' ↑':'Aucune')+'</div><div class="g2" style="margin-top:7px"><button id="goal" class="btn">⚽ BUT TEAM</button><button id="against" class="btn">⚽ BUT ADVERSE</button></div></div><div class="card"><b>Derniers événements</b>'+events.slice(0,6).map(e=>'<div class="event">'+esc(e.event_type)+' · '+fmt(e.match_time_ms)+'</div>').join('')+'</div>'}
if(t==='terrain'){h='<div class="card"><div class="pitch">'+P.map(p=>'<button class="slot" data-pos="'+p+'" style="top:'+XY[p][0]+';left:'+XY[p][1]+'"><span class="face">'+ini(name(lineup[p]))+'</span><b>'+esc(name(lineup[p]))+'</b><small>'+p+'</small></button>').join('')+'</div></div><div class="card"><b>Banc</b>'+bench().map(p=>'<div class="row"><span class="av">'+ini(p.display_name)+'</span><span><b>'+esc(p.display_name)+'</b><small class="mut">'+esc(p.status)+'</small></span><b>→</b></div>').join('')+'</div>'}
if(t==='tableau'){h='<div class="card"><div class="score">'+match.score_us+' – '+match.score_them+'</div><div id="clk" class="clock">'+fmt(elapsed())+'</div></div><div class="card g2">'+[['GOAL_RECORDED','⚽ BUT'],['ASSIST_RECORDED','🎯 PASSE D.'],['SHOT_RECORDED','↗ TIR'],['SHOT_ON_TARGET_RECORDED','🎯 CADRÉ'],['RECOVERY_RECORDED','✅ RÉCUP.'],['LOSS_RECORDED','❌ PERTE'],['SAVE_RECORDED','🧤 ARRÊT GB'],['CORNER_RECORDED','🚩 CORNER']].map(x=>'<button class="btn" data-evt="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'}
if(t==='rot'){let n=nextRot();h='<div class="card"><h2>Rotation Engine</h2><div class="g3"><div class="event"><b>36:00</b><br><span class="mut">CIBLE</span></div><div class="event"><b>06:00</b><br><span class="mut">INTERVALLE</span></div><div class="event"><b>'+players.length+'</b><br><span class="mut">JOUEURS</span></div></div></div><div class="card"><div class="event" style="font-size:17px;text-align:center">'+(n?esc(name(n.out))+' ↓ → '+esc(name(n.inn))+' ↑':'Aucune rotation')+'</div>'+(n?'<button id="dorot" class="btn pri" style="margin-top:8px">EFFECTUER</button>':'')+'</div>'}
if(t==='joueurs'){let f=new Set(Object.values(lineup));h='<div class="card"><b>Effectif · '+players.length+' joueurs</b>'+players.map(p=>'<div class="row"><span class="av">'+ini(p.display_name)+'</span><span><b>'+esc(p.display_name)+'</b><small class="mut">'+(f.has(p.id)?'Terrain':'Banc')+' · '+esc(p.status)+'</small></span><b>'+(f.has(p.id)?'●':'')+'</b></div>').join('')+'</div>'}
if(t==='staff'){h='<div class="card"><h2>Staff Live</h2><div class="event">'+esc(user.email)+'<br>Rôle : <b>'+esc(role)+'</b></div><button id="logout" class="btn" style="margin-top:8px">SE DÉCONNECTER</button></div><div class="card g3"><div class="event"><b>'+match.score_us+'-'+match.score_them+'</b><br><span class="mut">SCORE</span></div><div class="event"><b>'+fmt(elapsed())+'</b><br><span class="mut">TEMPS</span></div><div class="event"><b>'+events.length+'</b><br><span class="mut">EVENTS</span></div></div>'}
$('root').innerHTML=h+nav();bind();if(!soft)scrollTo(0,0)}
async function patch(obj){let d=await api('/rest/v1/rpc/update_match_if_version',{method:'POST',body:JSON.stringify({p_match_id:MATCH,p_expected_version:match.version,p_patch:obj})});return d}
async function clockToggle(){let obj=match.clock_status==='running'?{clock_status:'paused',accumulated_ms:elapsed(),started_at:null}:{clock_status:'running',accumulated_ms:+match.accumulated_ms||0,started_at:new Date().toISOString()};await patch(obj);await load();render()}
async function saveLine(pos,id){if(role!=='principal')return alert('Seul le coach principal modifie la composition.');lineup={...lineup,[pos]:id};await api('/rest/v1/match_snapshots?on_conflict=match_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({match_id:MATCH,version:match.version,snapshot:{lineup},updated_at:new Date().toISOString()})});await load();render('terrain')}
async function ensureDevice(){let id=localStorage.tn6_device||crypto.randomUUID();localStorage.tn6_device=id;await api('/rest/v1/devices?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,user_id:user.id,display_name:'Mobile web',revoked_at:null})});return id}
async function record(type,pid){let dev=await ensureDevice();await api('/rest/v1/match_events',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({event_id:crypto.randomUUID(),match_id:MATCH,actor_id:user.id,device_id:dev,event_type:type,match_time_ms:elapsed(),client_sequence:Date.now(),expected_version:match.version,payload:{playerId:pid||null}})});await load();render()}
function pick(type){let f=P.map(x=>players.find(p=>p.id===lineup[x])).filter(Boolean),v=prompt('Joueur :\n'+f.map((p,i)=>(i+1)+'. '+p.display_name).join('\n'));let p=f[+v-1];if(p)record(type,p.id).catch(diag)}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));document.querySelectorAll('[data-evt]').forEach(b=>b.onclick=()=>pick(b.dataset.evt));document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{let bb=bench(),v=prompt('Remplacer '+name(lineup[b.dataset.pos])+' par :\n'+bb.map((p,i)=>(i+1)+'. '+p.display_name).join('\n'));let p=bb[+v-1];if(p)saveLine(b.dataset.pos,p.id).catch(diag)});if($('start'))$('start').onclick=()=>clockToggle().catch(diag);if($('per'))$('per').onclick=async()=>{await patch({period:match.period+1});await load();render()};if($('goal'))$('goal').onclick=()=>pick('GOAL_RECORDED');if($('against'))$('against').onclick=async()=>{await patch({score_them:match.score_them+1});await load();render()};if($('dorot'))$('dorot').onclick=()=>{let n=nextRot();if(n)saveLine(n.pos,n.inn).catch(diag)};if($('logout'))$('logout').onclick=()=>{localStorage.removeItem('tn6_token');location.reload()}}
setInterval(()=>{let c=$('clk');if(c)c.textContent=fmt(elapsed())},500);
window.addEventListener('error',e=>diag(e.error||e.message));window.addEventListener('unhandledrejection',e=>diag(e.reason));
(async()=>{try{await boot()}catch(e){diag(e);authScreen()}})();
</script></body></html>
